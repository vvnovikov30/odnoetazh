name: Deploy to Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Sync via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      # На хостинг уходит только то, что нужно сайту: дерево берётся из индекса git,
      # поэтому локальные артефакты (дампы заявок, слепки хостинга, кэши, node_modules)
      # физически не могут попасть в вебрут. Что именно не выгружается —
      # задано в .gitattributes через export-ignore.
      - name: Build deploy tree
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          git archive --format=tar HEAD | tar -x -C .deploy

          status=0
          for forbidden in tests .github .git .tools .clinerules requests.json requests.txt; do
            if [ -e ".deploy/$forbidden" ]; then
              echo "::error::Служебный объект '$forbidden' попал в .deploy — деплой остановлен"
              status=1
            fi
          done

          stray=$(cd .deploy && find . \( -name '*.bat' -o -name '*.ps1' -o -name '*.md' -o -name '*.py' -o -name '*.ndjson' -o -name '.env' \))
          if [ -n "$stray" ]; then
            echo "::error::В .deploy попали служебные файлы: $stray"
            status=1
          fi

          for required in index.php .htaccess robots.txt sitemap.xml; do
            if [ ! -f ".deploy/$required" ]; then
              echo "::error::Обязательный файл '$required' отсутствует в .deploy"
              status=1
            fi
          done

          echo "Файлов к выгрузке: $(find .deploy -type f | wc -l)"
          exit $status

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: ".deploy"
          target: "/var/www/u2988221/data/www/xn--80ahhialrcec8b1i.xn--p1ai"
          strip_components: 1