name: Deploy to Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Sync via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Copy files via SFTP
        uses: garygrossgarten/github-action-scp@release
        with:
          local: .
          remote: /www/xn--80ahhialrcec8b1i.xn--p1ai/
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          rmRemote: false
          exclude: ".git,.git/*,.github,.github/*,.tools,.tools/*,app,app/*,components,components/*,content,content/*,posts,posts/*,node_modules,node_modules/*,.next,.next/*,*.bat,*.ps1,*.md,.clinerules,requests.*,package*.json,tsconfig.json"