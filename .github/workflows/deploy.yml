name: Deploy to Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Sync via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      # На хостинг уходит только то, что нужно сайту: без VCS-метаданных,
      # CI-конфигов, тестов, документации и локальных утилит разработчика.
      - name: Build deploy tree
        run: |
          set -euo pipefail
          mkdir -p .deploy
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.next/' \
            --exclude 'node_modules/' \
            --exclude '.tools/' \
            --exclude 'tests/' \
            --exclude '*.md' \
            --exclude '.clinerules' \
            --exclude '*.bat' \
            --exclude '*.ps1' \
            ./ .deploy/
          for forbidden in tests .git .github .tools .clinerules; do
            if [ -e ".deploy/$forbidden" ]; then
              echo "::error::Служебный объект '$forbidden' попал в .deploy — деплой остановлен"
              exit 1
            fi
          done
          echo "Файлов к выгрузке: $(find .deploy -type f | wc -l)"
          find .deploy -maxdepth 1 -type f | sort

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: ".deploy"
          target: "/var/www/u2988221/data/www/xn--80ahhialrcec8b1i.xn--p1ai"
          strip_components: 1