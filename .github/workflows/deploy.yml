name: Deploy to Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Sync via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      # На хостинг уходит только то, что нужно сайту: дерево берётся из индекса git,
      # поэтому локальные артефакты (дампы заявок, слепки хостинга, кэши, node_modules)
      # физически не могут попасть в вебрут. Что именно не выгружается —
      # задано в .gitattributes через export-ignore.
      - name: Build deploy tree
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          git archive --format=tar HEAD | tar -x -C .deploy

          status=0
          # Исходники SSG (content/, templates/, *.py), тесты и инфраструктура на хостинге
          # не нужны: статьи уже скомпилированы в blog/*.php, шаблон встроен в каждую страницу.
          # Пустые каталоги из git archive утечкой не считаются — ищем только файлы.
          leaked=$(cd .deploy && find . -type f \( \
            -path './tests/*' -o -path './.github/*' -o -path './.git/*' -o \
            -path './.tools/*' -o -path './.clinerules' -o \
            -path './content/*' -o -path './templates/*' -o \
            -name 'requests.json' -o -name 'requests.txt' \) | head -20)
          if [ -n "$leaked" ]; then
            echo "::error::В .deploy попали служебные файлы: $leaked"
            status=1
          fi

          stray=$(cd .deploy && find . \( -name '*.bat' -o -name '*.ps1' -o -name '*.md' -o -name '*.py' -o -name '*.ndjson' -o -name '.env' \))
          if [ -n "$stray" ]; then
            echo "::error::В .deploy попали служебные файлы: $stray"
            status=1
          fi

          # Сгенерированные статьи блога — часть сайта: blog/ должен содержать хотя бы
          # одну страницу, если в каталоге blog.php есть ссылки на blog/*.php.
          if grep -q 'href="blog/' .deploy/blog.php 2>/dev/null; then
            if [ -z "$(find .deploy/blog -type f -name '*.php' 2>/dev/null | head -1)" ]; then
              echo "::error::В blog.php есть карточки статей, но в .deploy/blog/ нет страниц"
              status=1
            fi
          fi

          for required in index.php blog.php .htaccess robots.txt sitemap.xml; do
            if [ ! -f ".deploy/$required" ]; then
              echo "::error::Обязательный файл '$required' отсутствует в .deploy"
              status=1
            fi
          done

          echo "Файлов к выгрузке: $(find .deploy -type f | wc -l)"
          exit $status

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: ".deploy"
          target: "/var/www/u2988221/data/www/xn--80ahhialrcec8b1i.xn--p1ai"
          strip_components: 1